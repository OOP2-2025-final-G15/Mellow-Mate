{% extends "layout.html" %}
{% block content %}

<h2>目標設定</h2>

<form method="post">

  <label>目標体重 (kg)</label><br>
  <input type="number" name="targetWeight" step="0.1" value="{{ targetWeight }}"><br><br>

  <label>目標摂取カロリー (kcal)</label><br>
  <input type="number" name="targetCalories" value="{{ targetCalories }}"><br><br>

  <button type="submit">保存</button>
</form>

<a href="{{ url_for('dashboard') }}">ホームに戻る</a>

{% endblock %}
