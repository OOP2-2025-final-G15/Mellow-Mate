{% extends "layout.html" %}

{% block title %}歩数記録 - Mellow Mate{% endblock %}

{% block content %}
<h1>歩数記録</h1>
<form method="POST">
    <div>
        <label>日付</label><br>
        <input type="date" name="record_date" value="{{ today }}">
    </div>

    <div>
        <label>歩数</label><br>
        <input type="number" name="steps" required>
    </div>

    <button type="submit">登録</button>
</form>

<br>
<a href="{{ url_for('dashboard') }}">← ダッシュボードに戻る</a>

{% endblock %}
