{% extends "layout.html" %}

{% block title %}水分摂取記録 - Mellow Mate{% endblock %}

{% block content %}

<h1>水分摂取記録</h1>
<form method="POST">
    <div>
        <label>日付</label><br>
        <input type="date" name="record_date" value="{{ today }}">
    </div>

    <div>
        <label>摂取量（ml）</label><br>
        <input type="number" name="amount" required>
    </div>

    <button type="submit">登録</button>
</form>

<br>
<a href="{{ url_for('dashboard') }}">← ダッシュボードに戻る</a>

{% endblock %}
