<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>体重記録</title>
</head>

<body>

    <h1>体重記録</h1>

    <form method="POST">
        <div>
            <label>日付</label><br>
            <input type="date" name="record_date" value="{{ today }}">
        </div>

        <div>
            <label>体重（kg）</label><br>
            <input type="number" step="0.1" name="weight" required>
        </div>

        <button type="submit">登録</button>
    </form>

    <br>
    <a href="{{ url_for('dashboard') }}">← ダッシュボードに戻る</a>

</body>

</html>
