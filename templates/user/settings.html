{% extends "layout.html" %}

{% block title %}ユーザー設定 - Mellow Mate{% endblock %}

{% block content %}
    <main class="js"></main>
    <div class="settings-container">
        <h1>ユーザー設定</h1>
        <form action="{{ url_for('update_settings') }}" method="POST">
            <div class="form-group mb-3">
                <label for="userName">ユーザー名</label>
                <input type="text" id="userName" name="userName" class="form-control" value="{{ current_user.userName }}" required>
            </div>
            <div class="form-group mb-3">
                <label for="height">身長</label>
                <input type="number" id="height" name="height" class="form-control" value="{{ current_user.height }}" required>
            </div>
            <div class="form-group">
                <label>性別:</label>
                <select name="gender">
                    <option value="1">男性</option>
                    <option value="2">女性</option>
                    <option value="0">その他</option>
                </select>
            </div>
            <div class="form-group mb-3">
                <label for="age">年齢</label>
                <input type="number" id="age" name="age" class="form-control" value="{{ current_user.age }}" required>
            </div>
            <button type="submit" class="btn btn-primary">登録</button>
        </form>
        <a href="{{ url_for('dashboard') }}">戻る</a>
    </div>
{% endblock %}
